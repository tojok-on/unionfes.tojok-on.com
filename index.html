<style>

  @font-face {

    font-weight: 400;

  @font-face {
    font-family: "Share Tech Mono";

    font-weight: 400;

  :root {
    --bg: #07071a;
    --bg2: #0d0b2a;
    --ink: #eef0ff;
    --dim: #8a8fc0;
    --pink: #ff2ec4;
    --cyan: #00f0ff;
    --violet: #7b2ff7;

    --line: rgba(138, 143, 192, .18);
    --mono: "Share Tech Mono", monospace;
    --jp: "Zen Kaku Gothic New", sans-serif;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--jp);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--pink); color: #fff; }

  /* ---------- background layers ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .noise {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: .05;

    mix-blend-mode: overlay;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.14) 3px 4px);
    opacity: .5;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 1;
    overflow: hidden;
    padding: 4rem 1.25rem 5rem;
  }

  .hero-sky {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 55% at 50% 100%, rgba(123, 47, 247, .32), transparent 65%),
      radial-gradient(ellipse 70% 45% at 50% 105%, rgba(255, 46, 196, .22), transparent 60%),
      linear-gradient(to bottom, var(--bg) 0%, var(--bg2) 60%, #1b1040 100%);
  }

  .sun-wrap {
    position: absolute;
    left: 50%;
    bottom: 26%;
    transform: translateX(-50%);
    width: min(46vmin, 340px);
    aspect-ratio: 1;
    will-change: transform;
  }

  .sun {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(to bottom, #7ef7ff 0%, #34d4f2 22%, #b04df0 55%, #ff2ec4 78%, #ff7a59 100%);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 58% no-repeat,
      repeating-linear-gradient(to bottom, #000 0 5.2%, transparent 5.2% 9%) bottom / 100% 42% no-repeat;
    mask: linear-gradient(#000 0 0) top / 100% 58% no-repeat,
      repeating-linear-gradient(to bottom, #000 0 5.2%, transparent 5.2% 9%) bottom / 100% 42% no-repeat;
    filter: drop-shadow(0 0 42px rgba(255, 46, 196, .55)) drop-shadow(0 0 110px rgba(0, 240, 255, .35));
    animation: sun-breathe 7s ease-in-out infinite;
  }

  @keyframes sun-breathe {
    0%, 100% { filter: drop-shadow(0 0 42px rgba(255,46,196,.55)) drop-shadow(0 0 110px rgba(0,240,255,.35)); }
    50% { filter: drop-shadow(0 0 62px rgba(255,46,196,.8)) drop-shadow(0 0 140px rgba(0,240,255,.5)); }
  }

  .gridfloor {
    position: absolute;
    left: -25%;
    right: -25%;
    bottom: 0;
    height: 34%;
    transform-origin: top center;
    transform: perspective(420px) rotateX(58deg);
    background-image:

      linear-gradient(to bottom, rgba(255, 46, 196, .35) 1.5px, transparent 1.5px);
    background-size: 64px 64px;
    animation: grid-scroll 1.6s linear infinite;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%);
    mask-image: linear-gradient(to bottom, transparent, #000 30%);
  }

  @keyframes grid-scroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 0, 0 64px; }
  }

  .hero-inner { position: relative; z-index: 2; }

  .presents {
    font-family: var(--mono);
    letter-spacing: .55em;
    text-indent: .55em;

    color: var(--cyan);
    text-shadow: 0 0 12px rgba(0, 240, 255, .8);

    animation: flicker 5.5s linear infinite;

    19%, 21% { opacity: .35; }
    63%, 65% { opacity: .5; }

  .title {
    font-family: "Monoton", cursive;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 7.5rem);

    letter-spacing: .02em;
    background: linear-gradient(to bottom, #baf6ff 12%, var(--cyan) 38%, var(--violet) 62%, var(--pink) 88%);

    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 46, 196, .45)) drop-shadow(0 0 4px rgba(0, 240, 255, .6));

  .title .row { display: block; }

  .year {
    font-family: "Mr Dafoe", cursive;
    font-size: clamp(2.4rem, 8vw, 5.4rem);

    text-shadow:
      0 0 10px rgba(255, 46, 196, .9),
      0 0 34px rgba(255, 46, 196, .6),
      0 0 80px rgba(255, 46, 196, .4);
    transform: rotate(-6deg);
    margin-top: -.35em;
    position: relative;
    z-index: 2;
  }

  .hero-meta {
    margin-top: 2.4rem;
    display: inline-flex;
    align-items: center;
    gap: 1.2rem;
    font-family: var(--mono);
    font-size: clamp(.85rem, 2.4vw, 1.15rem);
    letter-spacing: .28em;
    text-indent: .28em;
    padding: .8rem 1.6rem;
    border: 1px solid rgba(0, 240, 255, .45);
    border-radius: 999px;
    color: var(--ink);
    background: rgba(7, 7, 26, .55);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 24px rgba(0, 240, 255, .18), inset 0 0 24px rgba(0, 240, 255, .07);
  }

  .hero-meta .sep { color: var(--pink); }

  .scroll-cue {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .4em;
    text-indent: .4em;
    color: var(--dim);
    animation: cue 2.2s ease-in-out infinite;

  @keyframes cue {
    0%, 100% { transform: translate(-50%, 0); opacity: .9; }
    50% { transform: translate(-50%, 8px); opacity: .4; }

  /* ---------- marquee ---------- */
  .marquee {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: rgba(13, 11, 42, .7);
    overflow: hidden;
    padding: .85rem 0;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    gap: 3rem;
    animation: marquee 40s linear infinite;
    font-family: var(--mono);
    font-size: .95rem;
    letter-spacing: .14em;
    white-space: nowrap;

  .marquee-track i { color: var(--pink); font-style: normal; }

  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }

  main { position: relative; z-index: 1; }

  section { padding: clamp(4rem, 9vw, 7.5rem) 1.25rem; }

  .container { max-width: 960px; margin: 0 auto; }

  .sec-head { text-align: center; margin-bottom: clamp(2.5rem, 6vw, 4rem); }

  .sec-eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .5em;
    text-indent: .5em;
    color: var(--pink);

    margin-bottom: .9rem;

  .sec-title {
    font-family: "Monoton", cursive;
    font-weight: 400;
    font-size: clamp(1.9rem, 6vw, 3.4rem);
    letter-spacing: .04em;
    background: linear-gradient(100deg, var(--cyan), var(--violet) 55%, var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(123, 47, 247, .5));
  }

  /* ---------- lineup ---------- */
  .lineup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.4rem 1.3rem 1.2rem;
    background: linear-gradient(160deg, rgba(13, 11, 42, .9), rgba(7, 7, 26, .9));
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2, .7, .3, 1.2), border-color .35s, box-shadow .35s;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 100% 0%, rgba(0, 240, 255, .12), transparent 55%),
      radial-gradient(120% 90% at 0% 100%, rgba(255, 46, 196, .12), transparent 55%);
    opacity: 0;
    transition: opacity .35s;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(0, 240, 255, .6);
    box-shadow: 0 10px 40px rgba(0, 240, 255, .12), 0 0 0 1px rgba(0, 240, 255, .2);
  }

  .card:hover::before { opacity: 1; }

  .card .no {
    position: absolute;
    top: .8rem;
    right: 1rem;
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--dim);
    letter-spacing: .2em;
  }

  .card .band {
    position: relative;
    font-weight: 900;
    font-size: 1.25rem;
    line-height: 1.35;
    letter-spacing: .02em;
    margin-bottom: .55rem;
    word-break: break-word;
  }

  .card .tribute {
    position: relative;
    display: flex;
    align-items: center;
    gap: .5rem;
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--cyan);
    letter-spacing: .08em;
  }

  .card .tribute::before {
    content: "▸";
    color: var(--pink);
  }

  .card .time-chip {
    position: relative;
    display: inline-block;
    margin-top: .9rem;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .18em;
    color: var(--amber);
    border: 1px solid rgba(255, 194, 75, .4);
    border-radius: 999px;
    padding: .25rem .7rem;
  }

  /* ---------- timetable ---------- */
  .timetable-sec {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(123, 47, 247, .12), transparent 60%);
  }

  .tt {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding-left: 1.1rem;
  }

  .tt::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: linear-gradient(to bottom, var(--cyan), var(--violet), var(--pink));
    box-shadow: 0 0 12px rgba(0, 240, 255, .5);
    border-radius: 2px;
  }

  .slot {
    position: relative;
    display: grid;
    grid-template-columns: 9.5rem 1fr;
    gap: 1.2rem;
    align-items: baseline;
    padding: 1.05rem 1.2rem;
    margin: 0 0 .55rem .9rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(13, 11, 42, .55);
    transition: border-color .3s, background .3s, transform .3s;
  }

  .slot::before {
    content: "";
    position: absolute;
    left: calc(-.9rem - 1.1rem - 4px);
    top: 50%;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    transform: translateY(-50%);
    background: var(--bg);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 10px rgba(0, 240, 255, .8);
  }

  .slot:hover {
    border-color: rgba(255, 46, 196, .55);
    background: rgba(255, 46, 196, .06);
    transform: translateX(6px);
  }

  .slot .time {
    font-family: var(--mono);
    font-size: .95rem;
    letter-spacing: .12em;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 240, 255, .5);
    white-space: nowrap;
  }

  .slot .act { min-width: 0; }

  .slot .band {
    font-weight: 900;
    font-size: 1.12rem;
    letter-spacing: .02em;
    word-break: break-word;
  }

  .slot .artist {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--dim);
    letter-spacing: .08em;
    margin-top: .2rem;
  }

  .slot .artist b { color: var(--pink); font-weight: 400; }

  .slot.break {
    border-style: dashed;
    background: transparent;
    opacity: .8;
  }

  .slot.break::before { border-color: var(--amber); box-shadow: 0 0 10px rgba(255, 194, 75, .7); }

  .slot.break .band {
    font-family: var(--mono);
    font-weight: 400;
    font-size: .85rem;
    letter-spacing: .3em;
    color: var(--amber);
  }

  .tt-open {
    display: flex;
    justify-content: center;
    margin-bottom: 2.2rem;
  }

  .tt-open .hero-meta { margin-top: 0; }

  /* ---------- info ---------- */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
    max-width: 760px;
    margin: 0 auto;
  }

  .info-cell {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.6rem 1.4rem;
    text-align: center;
    background: rgba(13, 11, 42, .55);
  }

  .info-cell .k {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .45em;
    text-indent: .45em;
    color: var(--pink);
    display: block;
    margin-bottom: .7rem;
  }

  .info-cell .v {
    font-family: var(--mono);
    font-size: 1.5rem;
    letter-spacing: .1em;
    color: var(--ink);
    text-shadow: 0 0 14px rgba(0, 240, 255, .45);
  }

  .info-cell .v small { font-size: .85rem; color: var(--dim); }

  /* ---------- footer ---------- */
  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--line);
    padding: 3rem 1.25rem 3.5rem;
    text-align: center;
    background: linear-gradient(to bottom, transparent, rgba(123, 47, 247, .08));
  }

  footer .logo-mini {
    font-family: "Monoton", cursive;
    font-size: 1.3rem;
    background: linear-gradient(100deg, var(--cyan), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
    margin-bottom: .8rem;
  }

  footer p {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .18em;
    color: var(--dim);
  }

  /* ---------- reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .3, 1);
  }

  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  @media (max-width: 560px) {
    .slot { grid-template-columns: 1fr; gap: .3rem; padding: .95rem 1rem; }
    .marquee-track { font-size: .8rem; }
  }
</style>
</head>

  ];

  const BREAKS = [
    { after: "13:05", label: "— BREAK —" },
  ];

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);

  /* lineup cards */
  document.getElementById("lineup-grid").innerHTML = ACTS.map((a, i) => `
    <div class="card reveal" style="transition-delay:${(i % 3) * 70}ms">
      <span class="no">${String(i + 1).padStart(2, "0")}</span>
      <div class="band">${esc(a.band)}</div>
      <div class="tribute">${esc(a.artist)}</div>
      <span class="time-chip">${a.start} – ${a.end}</span>
    </div>
  `).join("");

  /* timetable */
  document.getElementById("tt").innerHTML = ACTS.map((a) => {
    const br = BREAKS.find((b) => b.after === a.end);
    return `
      <div class="slot reveal">
        <span class="time">${a.start} – ${a.end}</span>
        <div class="act">
          <div class="band">${esc(a.band)}</div>
          <div class="artist">tribute to <b>${esc(a.artist)}</b></div>
        </div>
      </div>
      ${br ? `<div class="slot break reveal"><span class="time"></span><div class="act"><div class="band">${br.label}</div></div></div>` : ""}
    `;
  }).join("");

  /* marquee */
  const names = ACTS.map((a) => `<b>${esc(a.band)}</b> <span>/</span> <i>${esc(a.artist)}</i>`).join('<span>&nbsp;&nbsp;★&nbsp;&nbsp;</span>');
  document.getElementById("marquee-track").innerHTML =
    names + '<span>&nbsp;&nbsp;★&nbsp;&nbsp;</span>' + names + '<span>&nbsp;&nbsp;★&nbsp;&nbsp;</span>';

  /* scroll reveal */
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add("in");
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  /* starfield */
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const count = Math.min(180, Math.floor(innerWidth * innerHeight / 9000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.3 + .2,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 1.4 + .4,
    }));
  }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function draw(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const st of stars) {
      const tw = reduced ? 1 : (Math.sin(t / 900 * st.s + st.p) + 1) / 2;
      ctx.globalAlpha = .15 + tw * .65;
      ctx.fillStyle = Math.random() < .002 ? "#ff2ec4" : "#cfefff";
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduced) requestAnimationFrame(draw);
  }

  resize();
  addEventListener("resize", resize);
  requestAnimationFrame(draw);

  /* subtle hero parallax */
  const sun = document.getElementById("sun");
  if (!reduced && sun && matchMedia("(pointer: fine)").matches) {
    addEventListener("mousemove", (e) => {
      const dx = (e.clientX / innerWidth - .5) * 14;
      const dy = (e.clientY / innerHeight - .5) * 8;
      sun.style.transform = `translateX(calc(-50% + ${dx}px)) translateY(${dy}px)`;
    });
  }
</script>
</body>
</html>
